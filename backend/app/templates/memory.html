<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LifeOS Memory</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1117;color:#c9d1d9}
.header{background:#161b22;padding:12px 24px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.header h1{color:#58a6ff;font-size:18px}
.tabs{display:flex;gap:4px;margin-bottom:-13px;padding:0 24px;background:#161b22}
.tab{padding:8px 16px;border:1px solid #30363d;border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;color:#8b949e;background:#0d1117}
.tab.active{color:#58a6ff;background:#0d1117;border-color:#30363d #30363d #0d1117}
.layout{display:flex;height:calc(100vh - 90px)}
.sidebar{width:300px;border-right:1px solid #30363d;overflow-y:auto}
.sidebar .item{padding:12px 16px;border-bottom:1px solid #21262d;cursor:pointer}
.sidebar .item:hover{background:#161b22}
.sidebar .item.active{background:#1f6feb22;border-left:3px solid #58a6ff}
.sidebar .item .title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar .item .meta{font-size:11px;color:#8b949e;margin-top:2px}
.main{flex:1;display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding:24px}
.msg{margin-bottom:14px;max-width:80%}
.msg.user{margin-left:auto}
.msg.user .bubble{background:#1f6feb;color:#fff;border-radius:14px 14px 4px 14px}
.msg.assistant .bubble{background:#21262d;border-radius:14px 14px 14px 4px}
.msg.system .bubble{background:#da363322;border:1px solid #da3633;color:#f85149}
.bubble{padding:8px 14px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg .role{font-size:10px;color:#8b949e;margin-bottom:2px}
.msg.user .role{text-align:right}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:#484f58;font-size:15px}
.rag-item{padding:10px 16px;border-bottom:1px solid #21262d;font-size:13px}
.rag-item .role{font-size:10px;color:#8b949e}
.rag-item .text{line-height:1.4;margin-top:2px}
</style>
</head>
<body>
<div class="header"><h1>🧠 LifeOS Memory</h1><span style="display:flex;align-items:center;gap:12px"><span id="stats" style="font-size:13px;color:#8b949e"></span><button onclick="clearAll()" style="background:#da3633;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px">🗑 清空全部</button><button onclick="clearChat()" style="background:#30363d;color:#c9d1d9;border:1px solid #484f58;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px">清空对话</button><button onclick="clearRag()" style="background:#30363d;color:#c9d1d9;border:1px solid #484f58;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px">清空记忆</button></span></div>
<div class="tabs">
    <div class="tab active" onclick="switchTab('chat')">💬 对话历史</div>
    <div class="tab" onclick="switchTab('rag')">🔍 RAG 记忆库</div>
    <div class="tab" onclick="switchTab('extracted')">💎 提取记忆</div>
</div>
<div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main"><div class="messages" id="messages"><div class="empty">👈 选择对话查看</div></div></div>
</div>

<script>
const API='';let activeId=null,tab='chat';

async function switchTab(t){tab=t;document.querySelectorAll('.tab').forEach((e,i)=>e.classList.toggle('active',(i===0&&t==='chat')||(i===1&&t==='rag')||(i===2&&t==='extracted')));
 document.getElementById('sidebar').innerHTML='';document.getElementById('messages').innerHTML='<div class="empty">加载中...</div>';
 if(t==='chat') loadChat();else if(t==='rag') loadRag();else loadExtracted();}

async function loadChat(){
 try{
  const r=await fetch(`${API}/chat/conversations?limit=100`);const convs=await r.json();
  document.getElementById('stats').textContent=`${convs.length} 个对话`;
  document.getElementById('sidebar').innerHTML=convs.map(c=>`<div class="item ${c.id===activeId?'active':''}" onclick="select('${c.id}')"><div class="title">${esc(c.title||'(空)')}</div><div class="meta">${c.message_count}条 · ${fmt(c.updated_at)} · 🪙${c.total_tokens||0} · <a href="#" onclick="event.stopPropagation();deleteConv('${c.id}')" style="color:#f85149">🗑</a></div></div>`).join('');
  if(convs.length>0&&!activeId)select(convs[0].id);
 }catch(e){document.getElementById('stats').textContent='无法连接';}
}

async function select(id){
 activeId=id;document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
 const item=document.querySelector(`.item[onclick="select('${id}')"]`);if(item)item.classList.add('active');
 document.getElementById('messages').innerHTML='<div class="empty">加载中...</div>';
 try{
  const r=await fetch(`${API}/chat/conversations/${id}/messages?limit=200`);const msgs=await r.json();
  document.getElementById('messages').innerHTML=msgs.length===0?'<div class="empty">暂无消息</div>':msgs.map(m=>`<div class="msg ${m.role}"><div class="role">${m.role.toUpperCase()}</div><div class="bubble">${esc(m.content)}</div></div>`).join('');
  document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
 }catch(e){document.getElementById('messages').innerHTML='<div class="empty">加载失败</div>';}
}

async function loadRag(){
 try{
  const r=await fetch(`${API}/rag/memories?limit=100`);const mems=await r.json();
  if(mems.error){document.getElementById('messages').innerHTML=`<div class="empty">${mems.error}</div>`;return}
  document.getElementById('stats').textContent=`${mems.length} 条记忆`;
  document.getElementById('sidebar').innerHTML='';
  document.getElementById('messages').innerHTML=mems.length===0?'<div class="empty">暂无 RAG 记忆<br><br>发送消息后自动生成</div>':mems.map(m=>`<div class="rag-item"><div class="role">${m.role.toUpperCase()}</div><div class="text">${esc(m.content)}</div></div>`).join('');
 }catch(e){document.getElementById('messages').innerHTML='<div class="empty">无法加载</div>';}
}

async function clearChat(){if(!confirm('确定要删除所有对话历史吗？'))return;try{await fetch(`${API}/chat/conversations`,{method:'DELETE'});alert('已清空');loadChat();}catch(e){alert('失败: '+e)}}
async function clearRag(){if(!confirm('确定要删除所有 RAG 记忆吗？'))return;try{await fetch(`${API}/rag/clear`,{method:'POST'});alert('已清空');loadRag();}catch(e){alert('失败: '+e)}}
async function clearAll(){if(!confirm('确定要清空所有数据（对话+记忆）吗？ 此操作不可撤销！'))return;try{await fetch(`${API}/chat/conversations`,{method:'DELETE'});await fetch(`${API}/rag/clear`,{method:'POST'});alert('已全部清空');loadChat();}catch(e){alert('失败: '+e)}}
async function deleteConv(id){if(!confirm('删除这个对话？'))return;try{await fetch(`${API}/chat/conversations/${id}`,{method:'DELETE'});activeId=null;loadChat();document.getElementById('messages').innerHTML='<div class="empty">👈 选择对话查看</div>';}catch(e){alert('失败: '+e)}}
async function loadExtracted(){
 try{
  const r=await fetch(`${API}/rag/extracted?limit=100`);const mems=await r.json();
  document.getElementById('stats').textContent=`${mems.length} 条提取记忆`;
  document.getElementById('sidebar').innerHTML='';
  const catColors={preference:'#a371f7',project:'#58a6ff',fact:'#3fb950',plan:'#d29922',persona:'#f778ba'};
  document.getElementById('messages').innerHTML=mems.length===0?'<div class="empty">暂无提取记忆<br><br>多轮对话后自动生成</div>':mems.map(m=>`<div class="rag-item"><div class="role"><span style="background:${catColors[m.category]||'#8b949e'}22;color:${catColors[m.category]||'#8b949e'};padding:1px 8px;border-radius:10px;font-size:11px;margin-right:6px">${m.category||'other'}</span>置信度:${m.confidence||0}% · 确认:${m.confirmations||1}次</div><div class="text">${esc(m.content)}</div></div>`).join('');
 }catch(e){document.getElementById('messages').innerHTML='<div class="empty">无法加载</div>';}
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmt(d){return new Date(d).toLocaleString('zh-CN')}

loadChat();setInterval(()=>tab==='chat'?loadChat():loadRag(),8000);
</script>
</body>
</html>
